name: CI

# What this repo can assert without a host or a node: the build, the secret-PROP rule, and the
# view linted and constructed for real. `nix build` proves nothing about QML: a bad import or a
# mistyped Theme token takes the view down at runtime and says so only through qWarning.
#
# The design system is not a flake input (the host links it), but its source decides whether
# `import Logos.Controls` resolves, so it is checked out at the revision the builder pins.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        run: nix build -L .#lgx

  secret-prop:
    name: no secret may be declared as a PROP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The .rep may take a secret as a SLOT argument, never as a PROP
        # A PROP is cached in the replica and broadcast to every connected replica. The node's
        # JSON-RPC cookie is the secret here: it must never become one.
        shell: bash
        run: |
          set -euo pipefail
          pat='^[[:space:]]*PROP[[:space:]]*\(.*(password|passphrase|phrase|mnemonic|seed|privkey|private_key|secretkey|cookie|rpcauth)'
          test -f src/ZebradBackend.rep

          # Positive controls first: a grep over a moved file passes by finding nothing.
          printf '    PROP(QString rpcCookie="" READONLY)\n    PROP(QString rpcPassword READONLY)\n' > /tmp/bad.rep
          [ "$(grep -cEi "$pat" /tmp/bad.rep)" = 2 ] \
            || { echo "::error::the tripwire no longer detects a secret PROP"; exit 1; }
          printf '    SLOT(void saveConfig(QString configJson))\n    PROP(QString statusJson READONLY)\n' > /tmp/ok.rep
          if grep -qEi "$pat" /tmp/ok.rep; then
            echo "::error::the tripwire now refuses a permitted declaration"; exit 1
          fi

          if grep -nEi "$pat" src/ZebradBackend.rep; then
            echo "::error::a secret is declared as a PROP above: keep it out of the .rep."
            exit 1
          fi
          echo "NO_SECRET_PROP"

  qml:
    name: qmllint + construct
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: logos-zebrad-ui

      - name: Find the design-system revision the builder pins
        id: ds
        working-directory: logos-zebrad-ui
        shell: bash
        run: |
          set -euo pipefail
          rev=$(jq -r '.nodes as $n | ($n[.root].inputs["logos-module-builder"]) as $b
                       | $n[$n[$b].inputs["logos-design-system"]].locked.rev' flake.lock)
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no design-system pin in flake.lock ($rev)"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: logos-co/logos-design-system
          ref: ${{ steps.ds.outputs.rev }}
          path: logos-design-system

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Gate A — static (imports, type and property names)
        working-directory: logos-zebrad-ui
        # `-W 0` fails on the first warning. `--unqualified` is off: `logos` is injected by the host.
        run: |
          # shellcheck disable=SC2016  # the $(...) below is for the inner bash -c
          nix shell nixpkgs#qt6.qtdeclarative -c bash -c '
            QTQML=$(dirname $(dirname $(readlink -f $(command -v qmllint))))/lib/qt-6/qml
            qmllint -I "$QTQML" -I ../logos-design-system/src/qml \
                    -W 0 --unqualified disable src/qml/Main.qml'

      - name: Gate B — construct the view for real
        working-directory: logos-zebrad-ui
        run: |
          # shellcheck disable=SC2016  # the $(...) below is for the inner bash -c
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#qt6.qtsvg -c bash -c '
            d=$(dirname $(dirname $(readlink -f $(command -v qml))))
            # Basic: under a platform style the design system'"'"'s contentItem overrides are
            # rejected. QT_LOGGING_TO_CONSOLE: without it a runner sends every message to journald.
            QT_LOGGING_TO_CONSOLE=1 \
            QT_QUICK_CONTROLS_STYLE=Basic QT_QPA_PLATFORM=offscreen \
              timeout 60 qml -I "$d/lib/qt-6/qml" -I ../logos-design-system/src/qml \
              ci/construct.qml > /tmp/qml.log 2>&1
            status=$?
            cat /tmp/qml.log
            # A positive line, so an empty log (messages sent elsewhere) cannot pass.
            grep -q "VIEW-READY" /tmp/qml.log || { echo "::error::the view never reported ready"; exit 1; }
            # 124 IS THE PASS: the view is an Item, so a healthy load runs until timeout kills it.
            if [ $status -ne 124 ]; then
              echo "::error::qml exited $status (expected 124 = loaded and still running)"
              exit 1
            fi
            # The view guards every use of `logos`, so no ReferenceError is expected at all.
            # "Unable to assign [undefined]" is how a mistyped Theme token shows; qmllint misses it.
            if grep -qE "VIEW-ERROR|does not support customization|Cannot assign|Unable to assign|was not found|TypeError|ReferenceError" /tmp/qml.log; then
              echo "::error::QML errors above"; exit 1
            fi'

  windows:
    # The cross build on Linux, the PE and import-closure gates and the hand-off live in
    # logos-co/logos-windows-ci. No smoke: a module plugin has no entry point of its own.
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: default
